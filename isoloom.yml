# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# GOAD MINILAB: one domain, a Windows Server 2019 domain controller and a Windows 10 workstation.
# Isoloom builds the machines; GOAD's own playbooks build the lab from a controller.
version: 1
name: minilab

networks:
  lab: { cidr: 192.168.56.0/24 }

machines:
  dc01:
    networks: { lab: 30 }
    services: [{ port: 53, name: dns }, { port: 88, name: kerberos }, { port: 389, name: ldap }, { port: 445, name: smb }]
    resources: { cpus: 2, memory_mb: 4000 }
    vm:
      os: windows-server-2019
      # GOAD's own box for this lab.
      image:
        vagrant: mayfly/windows_server2019
      provision: [vagrant/ConfigureRemotingForAnsible.ps1]

  ws01:
    networks: { lab: 31 }
    services: [{ port: 445, name: smb }]
    resources: { cpus: 2, memory_mb: 4000 }
    vm:
      os: windows-10
      # GOAD's own box for this lab.
      image:
        vagrant: mayfly/windows10
      provision: [vagrant/ConfigureRemotingForAnsible.ps1]

provision:
  - ansible: ansible/main.yml
    inventory:
      - ad/MINILAB/data/inventory
      - ad/MINILAB/providers/isoloom/inventory
      - globalsettings.ini
    requirements: ansible/requirements_311.yml
